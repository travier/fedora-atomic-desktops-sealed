name: "Build QCOW2 images"

env:
  REGISTRY_GHCR: "ghcr.io/${{ github.repository_owner }}"
  REGISTRY_QUAY: "quay.io"
  REPO_NAME: "${{ github.event.repository.name }}"

on:
  # FIXME: Do not run on push as we do not properly fetch the latest valid
  # container tag yet
  # push:
  #   branches:
  #     - "main"
  #   paths:
  #     - ".github/workflows/disk-images.yml"
  # pull_request:
  #   branches:
  #     - "main"
  #   paths:
  #     - ".github/workflows/disk-images.yml"
  schedule:
    # FIXME: Manually set one hour after the container build
    - cron: '0 5 * * MON'
  workflow_dispatch:
    inputs:
      version:
        description: "Version (tag) to build the images for. Defaults to today's tag"
        required: false
        default: ''

# Allow:
# - Read access to the repo content
# - Write access to packages to allow access to GitHub container registry
permissions:
  contents: "read"
  packages: "write"

# Prevent multiple workflow runs from racing to ensure that pushes are made
# sequentialy for the main branch. Also cancel in progress workflow runs for
# pull requests only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    uses: ./.github/workflows/generate-matrix.yml
    with:
      version: ${{ inputs.version }}

  build-image:
    needs: generate-matrix
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7

      - name: "Runner setup"
        uses: travier/bootc-dev-actions/bootc-ubuntu-setup@main
        with:
          libvirt: true

      - name: "Login to Container Registry (ghcr.io)"
        uses: redhat-actions/podman-login@v1
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build disk image"
        run: |
          set -euxo pipefail
          podman pull ${REGISTRY_QUAY}/${REPO_NAME}/${VARIANT}:${RELEASE}.${VERSION}
          bcvk to-disk \
            --filesystem=btrfs \
            --composefs-backend \
            --bootloader=systemd \
            --format qcow2 \
            --disk-size 20G \
            ${REGISTRY_QUAY}/${REPO_NAME}/${VARIANT}:${RELEASE}.${VERSION} \
            ${VARIANT}-${RELEASE}.${VERSION}.qcow2
        env:
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ needs.generate-matrix.outputs.version }}
          RELEASE: ${{ matrix.fedora_release }}

      - name: "Install oras CLI"
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: oras-project/setup-oras@v1

      - name: "Setup cosign"
        uses: sigstore/cosign-installer@v3.10.0
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

      - name: "Login to Container Registry (quay.io)"
        uses: redhat-actions/podman-login@v1
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY_QUAY }}
          username: ${{ secrets.BOT_USERNAME }}
          password: ${{ secrets.BOT_SECRET }}

      - name: "Upload disk image as OCI artifact with oras"
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        id: "push"
        shell: bash
        run: |
          output="$(
            oras push \
              --annotation "quay.expires-after=4w" \
              --format json \
              ${REGISTRY_QUAY}/${REPO_NAME}/${VARIANT}:${RELEASE}.${VERSION}.qcow2 \
              "${VARIANT}-${RELEASE}.${VERSION}.qcow2":application/vnd.qcow2.image
          )"
          echo "oras output: ${output}"
          digest="$(echo "${output}" | jq --raw-output '.digest')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ needs.generate-matrix.outputs.version }}
          RELEASE: ${{ matrix.fedora_release }}

      - name: "Sign artifact (quay.io)"
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${{ env.REGISTRY_QUAY }}/${{ env.REPO_NAME }}/${{ matrix.variant }}@${{ steps.push.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
