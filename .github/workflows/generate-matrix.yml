name: Generate Matrix

on:
  workflow_call:
    outputs:
      matrix:
        description: "Expanded build matrix"
        value: ${{ jobs.generate-matrix.outputs.matrix }}
      version:
        description: "Version tag"
        value: ${{ jobs.generate-matrix.outputs.version }}
    inputs:
      version:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - name: Evaluate variants JSON
        id: variants
        run: |
          VARIANTS_JSON=$(just --evaluate variants | jq -c .)
          echo "json=$VARIANTS_JSON" >> $GITHUB_OUTPUT

      - name: Expand matrix
        id: expand
        run: |
          python3 << 'EOF'
          import json, os

          variants = json.loads(os.environ["VARIANTS_JSON"])
          matrix = []

          for variant, data in variants.items():
              image_url = data["image_url"]
              for release, tag in data["fedora_release_and_tag"]:
                  matrix.append({
                      "variant": variant,
                      "fedora_release": release,
                      "tag": tag,
                      "image_url": image_url
                  })

          print("Expanded matrix:", matrix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}")
          EOF
        env:
          VARIANTS_JSON: ${{ steps.variants.outputs.json }}

      - name: "Figure out daily version tag"
        id: version
        run: |
          set -euxo pipefail
          if [[ -n "${VERSION}" ]]; then
            version="${VERSION}"
          else
            version="$(date '+%Y%m%d').0"
          fi
          echo "Using version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
